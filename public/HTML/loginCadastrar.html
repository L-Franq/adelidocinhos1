<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="../IMG/Adelia logo.jpeg" type="image/x-icon">
    <title>register</title>
    <link rel="stylesheet" href="../CSS/loginCadastro.css" />
    <link
      rel="stylesheet"
      href="../vendor/sweetalert2.css"
    />
  </head>
  <body>
    <div class="container">
      <h2 id="titulo">Login</h2>

      <form id="formCadastro" class="hidden">
        <input
          name="cadastrarNome"
          id="cadastrarNome"
          type="text"
          placeholder="Nome"
          required
        />

        <input
          name="cadastrarEmail"
          id="cadastrarEmail"
          type="e-mail"
          placeholder="exemplo@gmail.com"
          required
        />

        <input
          name="cadastrarTelefone"
          id="cadastrarTelefone"
          type="text"
          placeholder="+244 xxx xxx xxx"
          maxlength="9"
          required
        />

        <input
          name="cadastrarSenha"
          id="cadastrarSenha"
          type="Password"
          placeholder="Senha"
          required
        />

        <p id="erro" class="hidden"></p>

        <button type="submit" name="btnCadastrar" id="btnCadastrar">
          Cadastrar
        </button>

        <p id="jaTenho">Já tenho conta</p>
      </form>

      <form id="formlogin">
        <input
          name="loginEmail"
          id="loginEmail"
          type="e-mail"
          placeholder="exemplo@gmail.com"
          required
        />

        <input
          name="loginPassword"
          id="loginPassword"
          type="Password"
          placeholder="Senha"
          required
        />

        <p id="erroL" class="hidden"></p>

        <button type="submit" name="logar" id="btnLogin">Entrar</button>

        <p id="aindaNaotenho">Cria Conta</p>
      </form>
    </div>

    <script src="../vendor/sweetalert2.js"></script>
    <script src="../JS/loginCadastrar.js"></script>
  </body>
</html>
