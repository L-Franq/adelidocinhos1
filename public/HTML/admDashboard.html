<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/dashboard.css" />
    <link rel="shortcut icon" href="../IMG/Adelia logo.jpeg" type="image/x-icon">
    <link rel="stylesheet" href="../vendor/sweetalert2.css" />
    <title>dashboard</title>
  </head>
  <body data-role="adm">
    <header>
      <div class="horario" id="horario">
        <p class="hoje" id="hoje">Segunda-feira, 02 de Fevereiro de 2026</p>
      </div>
    </header>

    <main>
      <section class="adm">
        <div class="profileInfo">
          <div class="perfilContainer">
            <img src="../IMG/Anonomous.jpg" id="perfilPic" alt="Foto de perfil" />
          </div>
          <p class="admName" id="admName">Administrador</p>
          <input type="file" id="inputFoto" accept="image/*" hidden />
        </div>

        <div class="accoes">
          <button id="carrgarCalendario">Carregar Calendário</button>
          <button id="lista">Lista de Clientes</button>
          <button class="visitas">Ver Visitas</button>
          <button>Trancar Dia</button>
          <button class="btn-sair">Sair</button>
        </div>
      </section>

      <section class="carregamentos">
        <iframe id="dashboardIframe" width="100%" height="100%" frameborder="0"></iframe>
      </section>
    </main>

    <script src="../JS/admDashboard.js"></script>
    <script src="../vendor/sweetalert2.js"></script>
    <script src="../vendor/fullcalendar.js"></script>
    <script src="../vendor/fullcalendarlang.js"></script>
  </body>
</html>
